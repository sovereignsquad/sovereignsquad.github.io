<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sovereign Squad</title>
    <meta http-equiv="refresh" content="0; url=https://sovereignsquad.github.io/general-design-system/" />
    <link rel="canonical" href="https://sovereignsquad.github.io/general-design-system/" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top right, rgba(84, 195, 255, 0.22), transparent 38%),
          radial-gradient(circle at bottom left, rgba(164, 64, 255, 0.24), transparent 36%),
          #0f1230;
        color: #f4f6ff;
      }

      main {
        width: min(32rem, calc(100vw - 2rem));
        border: 1px solid rgba(208, 214, 255, 0.2);
        border-radius: 20px;
        padding: 2rem;
        background: rgba(15, 18, 48, 0.78);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.28);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 4vw, 2.75rem);
        line-height: 1.05;
      }

      p {
        margin: 0 0 1rem;
        font-size: 1.05rem;
        line-height: 1.6;
        color: rgba(244, 246, 255, 0.86);
      }

      a {
        color: #8fe1ff;
        font-weight: 600;
      }
    </style>
    <script>
      window.location.replace('https://sovereignsquad.github.io/general-design-system/');
    </script>
  </head>
  <body>
    <main>
      <h1>Sovereign Squad</h1>
      <p>The root GitHub Pages site now forwards to the canonical General Design System reference site.</p>
      <p><a href="https://sovereignsquad.github.io/general-design-system/">Open the GDS site</a></p>
    </main>
  </body>
</html>
